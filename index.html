<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Story Time">
<meta name="theme-color" content="#0d0025">
<title>✨ Story Time</title>
<style>
@font-face{font-family:'Bubblegum Sans';src:local('Bubblegum Sans'),local('Comic Sans MS'),local('Chalkboard SE');font-display:swap}
</style>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{min-height:100vh;background:radial-gradient(ellipse at 30% 20%,#1a0040 0%,#0d0025 50%,#000518 100%);font-family:-apple-system,'Nunito',system-ui,sans-serif;display:flex;align-items:center;justify-content:center}
#stars-bg{position:fixed;inset:0;pointer-events:none;z-index:0}
.star{position:absolute;border-radius:50%;background:#fff}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.7)}50%{opacity:.9;transform:scale(1.3)}}
#confetti-layer{position:fixed;inset:0;pointer-events:none;z-index:999;display:none}
.cp{position:absolute;border-radius:2px}
@keyframes cfall{0%{transform:translateY(-10px) rotate(0deg);opacity:1}100%{transform:translateY(140px) rotate(720deg);opacity:0}}
#card{width:calc(100vw - 12px);max-width:430px;max-height:96vh;background:linear-gradient(160deg,#fff9f2,#fff5e6);border-radius:32px;overflow:hidden;box-shadow:0 0 80px rgba(255,180,50,.25),0 20px 60px rgba(0,0,0,.6);border:3px solid rgba(255,215,100,.3);display:flex;flex-direction:column;position:relative;z-index:10}
#hdr{padding:13px 16px 9px;text-align:center;transition:background .4s}
#hdr-title{font-family:'Bubblegum Sans',cursive;font-size:18px;color:#fff;letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.35)}
#week-row{display:flex;gap:5px;justify-content:center;margin-top:6px;flex-wrap:wrap}
.wbtn{font-family:'Bubblegum Sans',cursive;font-size:11px;padding:3px 9px;border-radius:20px;border:none;cursor:pointer;font-weight:700;transition:all .2s}
#day-row{display:flex;gap:5px;padding:10px 10px 8px;overflow-x:auto;background:rgba(255,255,255,.6);border-bottom:2px solid rgba(200,150,50,.2)}
#day-row::-webkit-scrollbar{display:none}
.dbtn{flex-shrink:0;width:43px;height:43px;border-radius:50%;border:3px solid transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;transition:all .2s;background:rgba(0,0,0,.06);color:#888}
.dbtn.active{color:#fff}
#content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
#content::-webkit-scrollbar{width:5px}
#content::-webkit-scrollbar-thumb{background:rgba(100,60,160,.25);border-radius:3px}
@keyframes slideUp{from{transform:translateY(28px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes popIn{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes wobble{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes eq{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
.cover{padding:18px 18px 22px;text-align:center;animation:slideUp .4s ease}
.c-emoji{display:inline-block;font-size:70px;animation:bounce 2.2s infinite;margin-bottom:6px}
.c-title{font-family:'Bubblegum Sans',cursive;font-size:25px;line-height:1.2;margin-bottom:3px}
.c-sub{font-size:13px;color:#999;font-style:italic;margin-bottom:12px}
.moral-box{border-radius:16px;padding:10px 14px;margin-bottom:16px;display:flex;align-items:flex-start;gap:8px;border:2px dashed}
.moral-box span{flex-shrink:0;font-size:18px}
.moral-box p{font-size:12px;font-weight:700;line-height:1.4;text-align:left}
.day-badge{display:inline-flex;align-items:center;gap:6px;border-radius:20px;padding:5px 14px;margin-bottom:18px;border:2px solid;font-size:12px;font-weight:700}
.read-btn{border:none;border-radius:24px;padding:14px 28px;font-family:'Bubblegum Sans',cursive;font-size:20px;cursor:pointer;width:100%;letter-spacing:1px;color:#fff;transition:transform .1s}
.read-btn:active{transform:scale(.97)}
.story-view{padding:14px 14px 18px;animation:slideUp .35s ease}
.s-hdr{display:flex;align-items:center;gap:10px;margin-bottom:12px;border-radius:14px;padding:8px 12px;border-left:4px solid}
.s-hdr-text{flex:1}
.s-hdr-title{font-family:'Bubblegum Sans',cursive;font-size:16px}
.s-hdr-sub{font-size:11px;color:#999;font-style:italic}
.para{padding:9px 12px;border-radius:12px;margin-bottom:7px;transition:all .35s ease;border-left:3px solid transparent}
.para.hi{border-left:3px solid var(--sc);background:#fff9c4}
.para p{font-size:15px;line-height:1.85;color:#3a3050;font-weight:500;transition:all .35s}
.para.hi p{color:#3a2000;font-weight:700}
#dots{display:flex;gap:4px;justify-content:center;margin-bottom:14px;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;background:#e0e0e0;transition:all .3s}
.dot.done{background:var(--sc)}.dot.cur{transform:scale(1.45);background:var(--sc)}
#emo-badge{display:none;align-items:center;justify-content:center;gap:7px;margin-bottom:9px;border-radius:20px;padding:6px 14px;border:1.5px solid var(--sc);background:var(--sc-bg);animation:slideUp .3s ease}
#emo-badge.on{display:flex}
.eq-bar{display:inline-block;width:5px;border-radius:3px;opacity:.7;background:var(--sc)}
.tts-row{display:flex;gap:10px;margin-bottom:10px}
#play-btn{flex:1;padding:13px;color:#fff;border:none;border-radius:20px;cursor:pointer;font-family:'Bubblegum Sans',cursive;font-size:17px;display:flex;align-items:center;justify-content:center;gap:7px;transition:transform .1s;background:var(--sg)}
#play-btn:active{transform:scale(.97)}
#restart-btn{width:50px;padding:13px 8px;background:rgba(0,0,0,.07);color:#777;border:none;border-radius:20px;cursor:pointer;font-size:17px}
.hint{text-align:center;font-size:11px;color:#bbb;margin-bottom:12px;display:flex;align-items:center;justify-content:center;gap:4px}
#quiz-trigger{display:none;width:100%;padding:12px;border:none;border-radius:20px;font-family:'Bubblegum Sans',cursive;font-size:17px;cursor:pointer;color:#fff;background:linear-gradient(135deg,#FF79C6,#CC5DE8);box-shadow:0 4px 14px rgba(204,93,232,.45);margin-bottom:7px;animation:slideUp .4s ease}
#back-btn{width:100%;margin-top:4px;padding:9px;background:transparent;color:#bbb;border:2px solid #e8e8e8;border-radius:20px;cursor:pointer;font-size:13px;font-weight:700}
.quiz-view{padding:18px 14px 22px;animation:slideUp .35s ease}
.qz-hdr{text-align:center;margin-bottom:14px}
.qz-hdr h2{font-family:'Bubblegum Sans',cursive;font-size:22px}
.qz-hdr p{font-size:12px;color:#aaa;margin-top:2px}
#qz-prog{height:8px;background:#eee;border-radius:8px;margin:10px 0;overflow:hidden}
#qz-bar{height:100%;border-radius:8px;transition:width .5s ease;background:var(--sg)}
.q-box{border-radius:18px;padding:14px;margin-bottom:14px;text-align:center;border:2px solid var(--sc-light)}
.q-emoji{font-size:30px;margin-bottom:7px}
.q-text{font-family:'Bubblegum Sans',cursive;font-size:17px;color:#2c1654;line-height:1.4}
#opts{display:flex;flex-direction:column;gap:9px}
.opt{padding:12px 14px;border-radius:16px;cursor:pointer;font-family:'Nunito',sans-serif;font-size:14px;font-weight:700;text-align:left;transition:all .3s;display:flex;align-items:center;gap:9px;border:2.5px solid #e0e0e0;background:#fff;color:#333}
.opt:active{transform:scale(.97)}
.opt.correct{background:#d3f9d8;border-color:#51CF66;color:#2f9e44;animation:popIn .4s ease}
.opt.wrong{background:#ffe3e3;border-color:#FF5757;color:#c92a2a}
.opt-letter{width:27px;height:27px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Bubblegum Sans',cursive;font-size:12px;flex-shrink:0;transition:all .3s;background:var(--sc-bg);color:var(--sdc)}
.opt.correct .opt-letter{background:#51CF66;color:#fff}
.opt.wrong .opt-letter{background:#FF5757;color:#fff}
#feedback{display:none;margin-top:12px;padding:11px;border-radius:16px;text-align:center;font-size:15px;animation:slideUp .3s ease}
.done-view{padding:26px 18px 30px;text-align:center;animation:slideUp .4s ease}
.trophy{font-size:62px;animation:bounce 1s infinite;display:inline-block}
.done-title{font-family:'Bubblegum Sans',cursive;font-size:27px;margin-top:8px;margin-bottom:5px}
.done-msg{font-size:14px;color:#777;margin-bottom:14px}
.star-row{display:flex;gap:10px;justify-content:center;margin-bottom:18px}
.sa{font-size:36px;transition:opacity .3s}.sa.off{opacity:.2}
.moral-card{border-radius:18px;padding:14px;margin-bottom:18px;border:2px dashed var(--sc)}
.moral-card-lbl{font-size:13px;font-weight:800;color:#777;margin-bottom:4px}
.moral-card-txt{font-family:'Bubblegum Sans',cursive;font-size:15px;line-height:1.4}
#again-btn{width:100%;padding:13px;color:#fff;border:none;border-radius:22px;font-family:'Bubblegum Sans',cursive;font-size:17px;cursor:pointer;background:var(--sg)}
#again-btn:active{transform:scale(.97)}
</style>
</head>
<body>
<div id="stars-bg"></div>
<div id="confetti-layer"></div>
<div id="card">
  <div id="hdr">
    <div id="hdr-title">✨ Story Time with Matthew &amp; Drea ✨<button onclick="openNames()" style="background:none;border:none;color:#fff;font-size:16px;cursor:pointer;margin-left:6px;vertical-align:middle;opacity:.8">⚙️</button></div>
    <div id="week-row"></div>
  </div>
  <div id="day-row"></div>
  <div id="content"></div>
</div>
<div id="name-modal" style="display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.6);align-items:center;justify-content:center">
  <div style="background:#fff;border-radius:24px;padding:24px;width:90%;max-width:340px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4)">
    <div style="font-family:'Bubblegum Sans',cursive;font-size:20px;margin-bottom:14px">✏️ Change Names</div>
    <label style="font-size:13px;font-weight:700;color:#666;display:block;text-align:left;margin-bottom:4px">Character 1 (replaces Matthew):</label>
    <input id="inp-name1" style="width:100%;padding:10px;border-radius:12px;border:2px solid #ddd;font-size:16px;margin-bottom:12px" placeholder="Matthew">
    <label style="font-size:13px;font-weight:700;color:#666;display:block;text-align:left;margin-bottom:4px">Character 2 (replaces Drea):</label>
    <input id="inp-name2" style="width:100%;padding:10px;border-radius:12px;border:2px solid #ddd;font-size:16px;margin-bottom:12px" placeholder="Drea">
    <hr style="border:none;border-top:1px solid #eee;margin:8px 0 12px">
    <label style="font-size:13px;font-weight:700;color:#666;display:block;text-align:left;margin-bottom:4px">🎙️ ElevenLabs API Key <span style="font-weight:400;color:#aaa">(free at elevenlabs.io)</span>:</label>
    <input id="inp-elkey" type="password" style="width:100%;padding:10px;border-radius:12px;border:2px solid #ddd;font-size:14px;margin-bottom:6px" placeholder="Paste key for realistic voice">
    <p style="font-size:11px;color:#aaa;text-align:left;margin-bottom:16px">Without key: uses basic device voice. With key: lifelike narration (cached offline).</p>
    <div style="display:flex;gap:10px">
      <button onclick="closeNames()" style="flex:1;padding:11px;border-radius:16px;border:2px solid #ddd;background:#fff;font-weight:700;cursor:pointer;font-size:14px">Cancel</button>
      <button onclick="applyNames()" style="flex:1;padding:11px;border-radius:16px;border:none;background:linear-gradient(135deg,#CC5DE8,#845EF7);color:#fff;font-weight:700;cursor:pointer;font-size:14px">Save ✓</button>
    </div>
  </div>
</div>
<script>
const TOTAL_DAYS=30;
const DAYS_PER_WEEK=[7,7,7,7,2];
const DAY_NAMES=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
const DAY_SHORT=["MON","TUE","WED","THU","FRI","SAT","SUN"];
const DAY_COLORS=["#FF5757","#FF922B","#FFD43B","#51CF66","#4DABF7","#CC5DE8","#FF79C6"];
const STORIES=[];
</script>
<script>
// WEEK 1
STORIES.push(
{week:1,day:0,title:"The Great Race",sub:"The Tortoise & the Hare",emoji:"🐢",color:"#51CF66",dark:"#2f9e44",moral:"Slow and steady wins the race. Never, ever give up!",paras:["Once upon a time, in a beautiful green meadow filled with colorful flowers, there lived two best friends named Matthew and Drea.","Matthew was a quick and bouncy little hare with the longest, floppiest ears. He loved to zoom around the meadow all day long!","Drea was a gentle and careful little tortoise who carried her shiny green shell wherever she went. She moved slowly, but she was always smiling.","One bright sunny morning, Matthew hopped over to Drea. I am the fastest animal in the whole meadow! I bet you cannot race me to the big oak tree!","Drea looked at her friend with kind eyes. I will race you, Matthew. But remember, being fast is not always everything.","All the animals gathered to watch. The wise old owl called out... Ready... set... GO!","Matthew zoomed ahead like a rocket! He was so far ahead that he thought, I have plenty of time! I will take a little nap. He curled up and fell fast asleep.","But Drea kept walking. Slowly and carefully, one little step at a time. She never stopped, not even once!","When Matthew finally woke up, he looked down the path. Oh no! There was Drea, almost at the finish line!","Matthew jumped up and ran as fast as he could! But it was too late. Drea stepped across the finish line first!","All the animals cheered! Hooray for Drea!","Drea smiled her warm smile. You are very fast, my dear friend. But I kept going and I never, ever gave up.","Matthew hugged his friend. You taught me something wonderful today. What matters most is that we never give up! The end!"],questions:[{q:"Why did Matthew lose the race?",opts:["He fell in the river","He stopped for a nap","He ran the wrong way"],ans:1,emoji:"😴"},{q:"What did Drea do to win?",opts:["She ran very fast","She took a shortcut","She never stopped walking"],ans:2,emoji:"🐢"},{q:"What is the big lesson?",opts:["Always take long naps","Never give up, keep trying!","Only fast animals win"],ans:1,emoji:"⭐"}]},
{week:1,day:1,title:"A Little Friend's Big Heart",sub:"The Lion & the Mouse",emoji:"🦁",color:"#FFD43B",dark:"#f08c00",moral:"Everyone, big or small, has something wonderful to give. Be kind to all!",paras:["Once upon a time, deep in a warm and sunny jungle, there lived a great big lion named Matthew with a glorious golden mane.","One lazy afternoon, Matthew was napping under his favorite tree when something tiny tickled his nose!","There, scurrying across his face, was a tiny little mouse named Drea!","Matthew sat up and ROARED! Who dares to wake me up?","Little Drea trembled but looked up bravely. I am so sorry, Matthew! Please do not hurt me. I am only very small!","Matthew laughed a big belly laugh. You are so little! How could a tiny mouse ever help a great lion like me? I will let you go because you made me laugh!","Drea bowed her head. Thank you, Matthew. I promise, one day I will help you too!","But a few days later, SNAP! A hunter's net fell and trapped Matthew! He pulled and pulled but the ropes were too strong.","Then he heard the tiniest voice. Matthew! I am coming to help!","It was Drea! She chewed through the ropes with her sharp little teeth. Nibble, nibble, chew! One rope snapped. Then another!","At last, Matthew was FREE! You saved me, dear friend. I was so wrong to laugh. Every person, no matter how small, has something wonderful to give.","Drea smiled. We all need each other, Matthew. Big and small together! The end!"],questions:[{q:"Why did Matthew laugh at Drea?",opts:["She was dancing","He thought she was too tiny to help","She told a joke"],ans:1,emoji:"😂"},{q:"How did Drea rescue Matthew?",opts:["She brought other animals","She chewed through the ropes","She found a key"],ans:1,emoji:"🐭"},{q:"What did this story teach us?",opts:["Lions are scary","Only big animals matter","Everyone can do something wonderful!"],ans:2,emoji:"⭐"}]},
{week:1,day:2,title:"The Three Little Pigs",sub:"A Story About Working Hard",emoji:"🐷",color:"#FF79C6",dark:"#c2255c",moral:"Hard work and doing things properly always keeps us safe and warm!",paras:["Once upon a time, three little pigs were ready to build their own houses! Their names were Matthew, Drea, and a cheerful pig named Pip.","Their mama hugged them tight. Please build your homes nice and strong so you will always be safe!","Matthew used straw. Quick and easy! He built his house in no time and skipped off to play.","Drea collected sturdy sticks and built a stick house with proper walls and a roof.","But Pip carried heavy bricks, one by one, and built a very strong, solid house.","Then one evening, a great big wolf came prowling through the woods!","He came to Matthew's straw house. Little pig, let me in! Not by the hair of my chinny-chin-chin!","Then I will HUFF and PUFF and BLOW your house DOWN! WHOOOOSH! The straw flew everywhere! Matthew ran to Drea's house!","The wolf HUFFED and PUFFED at Drea's stick house. Down came the sticks! They both ran to Pip's brick house!","No matter how hard the wolf huffed and puffed, the brick house would not budge!","The tired wolf gave up and stomped away. The three pigs were safe!","That night by the fire, Matthew said, You were right to work hard, Pip. Doing things carefully is always worth it! The end!"],questions:[{q:"Who built the strongest house?",opts:["Matthew with straw","Drea with sticks","Pip with bricks"],ans:2,emoji:"🏠"},{q:"Why did Matthew's house fall?",opts:["It was raining","He used straw because he was in a hurry","The wolf was magic"],ans:1,emoji:"🐺"},{q:"What is the lesson?",opts:["Building is fun","Pigs are clever","Working carefully is always worth it!"],ans:2,emoji:"⭐"}]},
{week:1,day:3,title:"Getting Ready for Winter",sub:"The Ant & the Grasshopper",emoji:"🐜",color:"#4DABF7",dark:"#1971c2",moral:"There is a time to play and a time to work. Doing both keeps us happy!",paras:["In a sunny meadow lived two friends: a cheerful grasshopper named Matthew and a busy little ant named Drea.","All summer, Drea worked hard carrying food to her cozy underground home.","Matthew spent his days hopping and singing. Drea! Come play! Why work when you can dance?","I am getting ready for winter, Matthew. You should save some food too.","But Matthew just laughed. Winter is far away! I have plenty of time!","Weeks passed. Leaves turned orange and gold. Then one cold morning, the meadow was covered in snow!","The flowers were gone. Seeds were buried under ice. Matthew's tummy grumbled with hunger.","Shivering and sad, Matthew knocked on Drea's door.","Drea opened it and saw her friend, cold and hungry. Oh, Matthew! Come inside! I have plenty to share.","Matthew stepped into the warm home. Seeds and berries stored neatly in rows. He had never felt so grateful.","I am so sorry, Drea. I played all summer instead of preparing. You were right.","Drea patted his hand. There is a right time for playing AND working. When we do both, we are always ready! The end!"],questions:[{q:"What did Drea do all summer?",opts:["She danced","She slept","She saved food for winter"],ans:2,emoji:"🐜"},{q:"Why was Matthew hungry in winter?",opts:["He gave food away","He ate it all","He played all summer and saved nothing"],ans:2,emoji:"❄️"},{q:"What should we remember?",opts:["Summer is best","There is a time to play AND work!","Ants are better"],ans:1,emoji:"⭐"}]},
{week:1,day:4,title:"Drea and the Three Bears",sub:"Based on Goldilocks",emoji:"🐻",color:"#FF5757",dark:"#c92a2a",moral:"Always ask before taking things. Say sorry when you make a mistake!",paras:["Once upon a time, a curious girl named Drea was exploring the forest with her brother Matthew.","Stay on the path! Matthew reminded her. But Drea spotted a cozy cottage with a yellow door!","She knocked. No one answered. The door swung open. She stepped inside.","On the table sat three bowls of porridge. She tasted the big bowl. Too hot! The middle bowl. Too cold! The little bowl. Just right! She ate it all up!","She found three chairs. The big one wobbled. The middle one was too tall. The little one was just right! But CRACK! It broke!","Feeling sleepy, she found three beds. The big bed was too hard. The middle too soft. The little bed was perfect, and she fell asleep!","Soon the Bear family came home. Someone ate my porridge! roared Papa Bear. Someone ate ALL of mine! cried Baby Bear.","They found Drea in Baby Bear's bed! She woke up, saw three bears, and ran all the way back to Matthew!","I should not have gone in without asking, she said. It was not my house.","The next morning, Drea went back with soup to say sorry. Baby Bear hugged her right away.","Because saying sorry and making things right is always the bravest thing we can do. The end!"],questions:[{q:"What did Drea break?",opts:["The window","Baby Bear's chair","The door"],ans:1,emoji:"🪑"},{q:"What did Drea do the next day?",opts:["Ran away","Pretended nothing happened","Brought soup and said sorry"],ans:2,emoji:"🍲"},{q:"What is the lesson?",opts:["Bears are friendly","Always ask before taking, and say sorry!","Breaking things is fine"],ans:1,emoji:"⭐"}]},
{week:1,day:5,title:"The Magic Beanstalk",sub:"Jack & the Beanstalk",emoji:"🌱",color:"#CC5DE8",dark:"#862e9c",moral:"Be brave and always look after the people you love!",paras:["A brave boy named Matthew lived with his sister Drea in a cozy cottage.","One day, Mama said sadly, We have no food left. Please sell our cow at the market.","On the way, Matthew met an old man. I will give you these magic beans for your cow! The beans sparkled with rainbow colors.","Mama was not pleased. Magic beans? She sent him to bed without supper.","But in the morning, a GIANT beanstalk had grown up into the clouds!","Drea grabbed his hand. Let us climb it! Hand in hand, they climbed into a kingdom in the clouds.","Inside a castle, a giant bellowed, FEE FI FO FUM! They hid behind a cupboard.","The giant fell asleep. They found a golden harp and a goose that laid golden eggs!","They tiptoed to the door but the harp cried MASTER! The giant woke up!","Matthew grabbed Drea's hand and they RAN! Down the beanstalk, faster than lightning!","On the ground, Matthew grabbed an axe. CHOP! CHOP! Down came the beanstalk!","With the golden eggs, they bought food and fixed their cottage. Mama hugged them. You were so brave, and you looked after each other! The end!"],questions:[{q:"What grew from the beans?",opts:["A flower","A beanstalk to the clouds","An apple tree"],ans:1,emoji:"🌱"},{q:"What did they find in the castle?",opts:["Gold coins","A harp and golden goose","Toys"],ans:1,emoji:"✨"},{q:"What did this teach us?",opts:["Giants are scary","Never plant beans","We are braver when we look after each other!"],ans:2,emoji:"⭐"}]},
{week:1,day:6,title:"The Beautiful Swan",sub:"The Ugly Duckling",emoji:"🦢",color:"#FF922B",dark:"#d9480f",moral:"You are special just as you are. True friends always see your worth!",paras:["On a quiet pond, a mother duck waited for her eggs to hatch. One by one, fluffy yellow ducklings appeared!","But one last egg was much bigger. Out came a duckling named Drea who looked different: grey feathers, long neck, big feet.","The other ducklings whispered. She does not look like us! They swam away from her.","Drea felt very sad. She sat alone in the quiet corner of the pond.","One afternoon, a friendly duck named Matthew paddled over. Why are you sitting alone?","The others will not play with me because I look different, she said quietly.","I think you look wonderful! Being different means you are uniquely special!","From that day, Matthew and Drea became best friends. They played together all summer.","When autumn came, they watched magnificent white birds glide across the sky. Those are swans, said Matthew.","Spring arrived. Drea looked at her reflection and gasped! White feathers! A graceful neck! She was a swan!","All the animals cried, How beautiful! But Drea only smiled when she saw Matthew swimming over.","I thought you were beautiful all along, he said. Thank you for being kind when no one else was. The end!"],questions:[{q:"Why did others ignore Drea?",opts:["She was loud","She looked different","She took the food"],ans:1,emoji:"🦆"},{q:"What did Matthew do?",opts:["Gave her food","Taught her to swim","Told her she was special and became her friend"],ans:2,emoji:"💙"},{q:"What did Drea discover?",opts:["She was fastest","She could sing","She was a gorgeous swan!"],ans:2,emoji:"⭐"}]}
);
</script>
<script>
// WEEK 2
STORIES.push(
{week:2,day:0,title:"The Grapes on the Vine",sub:"The Fox & the Grapes",emoji:"🍇",color:"#845EF7",dark:"#5f3dc4",moral:"Be honest about your feelings. It is okay to ask for help!",paras:["In a sunny orchard lived a clever fox named Matthew and his best friend, a kind rabbit named Drea.","One afternoon, they spotted magnificent purple grapes hanging high on a vine, glistening like jewels.","Those grapes look delicious! I must have some! cried Matthew.","They are very high up. Are you sure you can reach them? said Drea.","Matthew leaped again and again but could not reach. Finally he sat down, tired.","Hmph! Those grapes are probably sour anyway. I did not want them!","Drea raised her eyebrows. Do you really believe that? Or are you embarrassed you could not reach?","Matthew sighed. You are right. I felt embarrassed. That was not honest of me.","It is okay to not be able to do something. But it is better to say I need help.","Will you help me, Drea? What if you climbed on my shoulders?","Now THAT is a brilliant idea! Matthew stood tall, Drea climbed up, and grabbed the whole bunch!","They shared every grape. Everything is better when we are honest and ask for help! The end!"],questions:[{q:"Why did Matthew say grapes were sour?",opts:["He tasted them","He was embarrassed he could not reach","Drea told him"],ans:1,emoji:"🍇"},{q:"What should we say when we cannot do something?",opts:["Pretend we never wanted it","Get angry","Say I need help!"],ans:2,emoji:"🤝"},{q:"How did they get the grapes?",opts:["Waited for them to fall","A bird helped","They worked together!"],ans:2,emoji:"⭐"}]},
{week:2,day:1,title:"The Boy Who Cried Wolf",sub:"Always Tell the Truth",emoji:"🐺",color:"#FF922B",dark:"#d9480f",moral:"Always tell the truth. If you trick people, they will not believe you when you really need them!",paras:["High on a hillside, a shepherd boy named Matthew watched over fluffy white sheep every day.","One day, bored, he shouted: WOLF! WOLF! A wolf is coming!","His friend Drea ran up the hill with all the villagers. But there was no wolf. Matthew was laughing!","That was not funny, Matthew, said Drea. If you keep tricking us, we will not come when you truly need us.","A few days later, he cried wolf again. Everyone came. No wolf again. The villagers were very unhappy.","Then one afternoon, a REAL wolf crept out of the forest toward the sheep!","Matthew screamed: WOLF! PLEASE HELP! But the villagers shook their heads. Just his tricks again.","Only Drea listened carefully. His voice sounded truly frightened. She ran up the hill.","She arrived just in time! She shouted and waved, and the wolf ran away!","Matthew hugged her with shaking arms. Because I told lies, no one believed me. I will never trick anyone again.","And I will always listen carefully, said Drea. That is what true friends do. The end!"],questions:[{q:"Why did Matthew pretend there was a wolf?",opts:["He saw a shadow","He was bored","He was testing them"],ans:1,emoji:"🐑"},{q:"What happened when the real wolf came?",opts:["Everyone came","Nobody believed him","The wolf was friendly"],ans:1,emoji:"🐺"},{q:"What is the lesson?",opts:["Wolves are scary","Shepherds should not be alone","Always tell the truth!"],ans:2,emoji:"⭐"}]},
{week:2,day:2,title:"Little Red's Adventure",sub:"Little Red Riding Hood",emoji:"🧺",color:"#FF5757",dark:"#c92a2a",moral:"Always listen to your parents and trust your feelings when something seems wrong!",paras:["A kind girl named Drea always wore her favourite red coat. Everyone loved her dearly.","One morning, Mama gave her a basket of bread and soup. Grandma is not well. Take this to her. Stay on the path!","Drea skipped down the forest path. Birds sang. Sunlight danced through the trees.","A smooth voice called out. Hello! Where are you going? It was a big wolf trying to look friendly.","Drea remembered Mama's words. She walked faster without stopping. I am visiting my grandma.","At Grandma's cottage, something was wrong. Grandma, what big eyes you have! What big TEETH you have!","STOP RIGHT THERE! boomed a brave voice. It was Matthew, chopping wood nearby!","The wolf scrambled out and ran away forever!","Grandma came out from behind the wardrobe, perfectly safe.","You were so smart, said Matthew. You listened to your mama and trusted your feelings.","I will always listen to Mama. She was right! The end!"],questions:[{q:"What did Mama tell Drea?",opts:["Pick flowers","Run fast","Stay on the path, no strangers!"],ans:2,emoji:"🌲"},{q:"What helped Drea stay safe?",opts:["A magic basket","She listened to Mama and trusted her feelings","She ran fast"],ans:1,emoji:"🧺"},{q:"What should we do if something feels wrong?",opts:["Keep it secret","Pretend it is fine","Trust our feelings and tell a grown-up!"],ans:2,emoji:"⭐"}]},
{week:2,day:3,title:"The Wind and the Sun",sub:"Kindness is Stronger Than Force",emoji:"☀️",color:"#FFD43B",dark:"#e67700",moral:"Kindness and warmth always work better than pushing or forcing!",paras:["Matthew and Drea were sitting on a hill when they heard two voices arguing in the sky!","I am the most powerful! boomed the North Wind. No, I am! said the Sun calmly.","Let us have a contest! said the Wind. Whoever makes that traveler remove his coat wins!","The Wind blew with all his power! WHOOOOOSH! Trees bent! Leaves flew!","But the traveler pulled his coat TIGHTER! The harder the Wind blew, the tighter he held on.","Exhausted, the Wind gave up. Your turn, Sun.","The Sun smiled and shone softly, like a warm hug. The sky turned golden. Birds sang.","Matthew sighed happily. That feels so lovely and warm.","The traveler smiled, relaxed, and simply took off his coat!","I win! said the Sun. Force never works as well as kindness and warmth.","When you push people, they hold on tighter. When you are gentle, they open up on their own.","Being warm and kind really is the most powerful thing! The end!"],questions:[{q:"What did the Wind try?",opts:["Blow the coat off","Make him sit","Blow him away"],ans:0,emoji:"🌬️"},{q:"How did the Sun win?",opts:["Asked politely","Shone warm until he felt too warm","Made it rain"],ans:1,emoji:"☀️"},{q:"What did we learn?",opts:["Wind is strongest","Kindness works better than forcing!","It is always sunny"],ans:1,emoji:"⭐"}]},
{week:2,day:4,title:"The Clever Crows",sub:"The Crow & the Pitcher",emoji:"🐦",color:"#4DABF7",dark:"#1971c2",moral:"When you face a problem, stop and think! A clever idea can solve almost anything!",paras:["One hot day, two crows named Matthew and Drea flew over dry fields, desperately thirsty.","I am so thirsty, said Matthew, wings drooping. Me too, said Drea. But we must not give up!","They spotted a stone pitcher in a garden! They dove down eagerly.","There WAS water inside! But way down at the bottom. Matthew could not reach it with his beak.","Oh no. What can we do? Drea noticed pebbles on the garden path. A brilliant idea!","Matthew! What if we dropped pebbles in, one by one?","But why? Watch and see! She dropped a pebble. PLOP! The water rose just a tiny bit.","Matthew's eyes went wide! He grabbed a pebble. PLOP! A tiny bit more!","Together: Plop! Plop! Plop! With every pebble, the water crept higher!","At last it reached the top! They drank the most refreshing water ever.","We stopped, we thought, and we found a way! There is almost always a solution! The end!"],questions:[{q:"What was the problem?",opts:["They were lost","Water was too far down to reach","Could not find the garden"],ans:1,emoji:"🫙"},{q:"What was Drea's idea?",opts:["Knock it over","Drop pebbles to raise the water","Ask a human"],ans:1,emoji:"🪨"},{q:"What should we do with problems?",opts:["Give up","Cry","Stop, think, try a clever solution!"],ans:2,emoji:"⭐"}]},
{week:2,day:5,title:"Kind-Hearted Drea",sub:"Based on Cinderella",emoji:"👗",color:"#CC5DE8",dark:"#862e9c",moral:"Kindness and a good heart are the most beautiful things of all!",paras:["In a cheerful kingdom lived a kind girl named Drea with a warm heart and a happy song always on her lips.","Her stepsisters gave her all the chores. But Drea never stopped being kind and cheerful.","One day, the Prince was holding a grand ball! But her stepsisters laughed. You have too many chores!","That evening, a fairy godmother appeared, sparkling like a star! You shall go to the ball!","With a wave of her wand: a shimmering dress, a golden carriage, and glass slippers! But leave before midnight!","At the palace, Prince Matthew asked her to dance. They laughed all evening like the best of friends.","Then the clock chimed midnight! Drea ran down the steps. One glass slipper slipped off!","Next day, Matthew carried the slipper through the kingdom. At Drea's door, it fit perfectly.","It is you! he said with the most joyful smile.","Drea invited everyone in the village to celebrate.","Because the most beautiful thing about Drea was never her dress. It was always her kind heart. The end!"],questions:[{q:"Why was Drea sad?",opts:["Lost her shoes","Stepsisters would not let her go","She was sick"],ans:1,emoji:"😢"},{q:"Who helped Drea?",opts:["Stepsisters","A fairy godmother","Prince Matthew"],ans:1,emoji:"✨"},{q:"What made Drea special?",opts:["Glass slippers","Her dress","Her kind heart!"],ans:2,emoji:"⭐"}]},
{week:2,day:6,title:"City Mouse, Country Mouse",sub:"The Town Mouse & the Country Mouse",emoji:"🐭",color:"#51CF66",dark:"#2f9e44",moral:"Being safe and happy with people we love is better than any fancy thing!",paras:["Matthew lived in the big city. His cousin Drea lived in a cozy burrow in the countryside.","Matthew visited Drea. She served fresh berries, seeds, and warm bread.","This is lovely, but in the city we have cakes and fine cheeses! You must visit!","When Drea arrived, she could not believe it. Creamy cheese, cake, jam on a grand table!","She took a bite. Oh, this is magnificent!","But then STOMP! STOMP! A human was coming! They dove behind the curtain, trembling!","Then WOOF! WOOF! A dog sniffed them out! They ran until they squeezed through a crack in the wall.","They sat in the dark, hearts hammering.","Your food is delicious, Matthew. But I could not live in so much danger every day!","You are right. I have forgotten how peaceful your home is. Simple, but safe and good.","I would rather eat plain seeds in peace than fancy cake while living in fear.","Being safe and happy with those we love is worth more than any fancy thing! The end!"],questions:[{q:"What was great about Drea's home?",opts:["Fancy food","Safe, peaceful, full of love","Swimming pond"],ans:1,emoji:"🌿"},{q:"Why did Drea not want city life?",opts:["Bad food","Too cold","Too dangerous!"],ans:2,emoji:"🐭"},{q:"What is the lesson?",opts:["City food is best","Being safe and happy with loved ones matters most!","Country mice are smarter"],ans:1,emoji:"⭐"}]}
);
</script>
<script>
// WEEK 3
STORIES.push(
{week:3,day:0,title:"The Golden Egg",sub:"The Goose That Laid Golden Eggs",emoji:"🥚",color:"#FFD43B",dark:"#e67700",moral:"Be grateful for what you have. Greed can make us lose everything!",paras:["Once upon a time, a kind farmer named Matthew found a beautiful white goose named Drea in his garden.","Every morning, Drea laid one perfect golden egg! Matthew was so happy and grateful.","With each golden egg, Matthew bought food, fixed his cottage, and shared with his neighbors.","But one day, a greedy thought crept into his mind. If Drea lays one golden egg a day, maybe there are LOTS of golden eggs inside her!","He thought about cutting Drea open to get all the eggs at once. But then he looked at his dear friend.","What am I thinking? Drea is my friend! She gives me a wonderful gift every single day. I should be grateful, not greedy!","He sat down beside Drea and stroked her soft feathers. I am so sorry I had such a terrible thought. You are worth more than all the gold in the world.","Drea honked happily and nuzzled his hand.","From that day on, Matthew was always grateful for each golden egg. He never wished for more than he needed.","He shared his good fortune with everyone in the village, and they all lived happily together.","Because being grateful for what we have is the real treasure. The end!"],questions:[{q:"What did Drea lay every morning?",opts:["A silver coin","A golden egg","A diamond"],ans:1,emoji:"🥚"},{q:"What greedy thought did Matthew have?",opts:["Sell Drea","Get all eggs at once","Hide the eggs"],ans:1,emoji:"😟"},{q:"What is the lesson?",opts:["Geese are valuable","Be grateful for what you have!","Eggs are made of gold"],ans:1,emoji:"⭐"}]},
{week:3,day:1,title:"The Enormous Turnip",sub:"Working Together",emoji:"🥕",color:"#51CF66",dark:"#2f9e44",moral:"When we all work together, we can do amazing things no one could do alone!",paras:["Matthew planted a tiny turnip seed in his garden. He watered it every day with love and care.","The turnip grew and grew and GREW until it was the most ENORMOUS turnip anyone had ever seen!","Time to pull it up! said Matthew. He grabbed the turnip and pulled. He pulled and pulled. But it would not budge!","He called his friend Drea. Drea pulled Matthew, Matthew pulled the turnip. They pulled and pulled. Still stuck!","They called their friend Cat. Cat pulled Drea, Drea pulled Matthew, Matthew pulled the turnip. Still stuck!","They called Dog. Dog pulled Cat, Cat pulled Drea, Drea pulled Matthew. Still stuck!","They called tiny Mouse. Everyone laughed. How can little Mouse help?","Mouse grabbed on at the very end. Everyone pulled together. One... two... THREE!","POP! Out came the enormous turnip! They all tumbled backwards in a heap, laughing!","We did it! cried Matthew. But we could not have done it without every single one of us. Even tiny Mouse!","That night they made the most delicious turnip soup and shared it with the whole village.","When we all work together, we can do amazing things! The end!"],questions:[{q:"Why could Matthew not pull the turnip alone?",opts:["It was too small","It was too enormous","He was not strong enough"],ans:1,emoji:"🥕"},{q:"Who helped last?",opts:["Dog","Cat","Tiny Mouse"],ans:2,emoji:"🐭"},{q:"What is the lesson?",opts:["Turnips are heavy","Working together we can do amazing things!","Mice are the strongest"],ans:1,emoji:"⭐"}]},
{week:3,day:2,title:"The Rainbow Fish",sub:"Sharing Makes Us Happy",emoji:"🐟",color:"#4DABF7",dark:"#1971c2",moral:"Sharing what we have makes us happier than keeping everything for ourselves!",paras:["Deep in the sparkling blue ocean lived a beautiful fish named Matthew. He had the most dazzling, shimmering rainbow scales.","All the other fish admired him. But Matthew was proud and would not play with anyone.","One day, a little fish named Drea swam up shyly. Your scales are so beautiful! Could I please have just one?","Matthew flicked his tail. Give away MY scales? Never! They are mine! He swam away.","After that, no one wanted to play with Matthew. He was the most beautiful fish, but also the loneliest.","Feeling sad, he visited the wise old octopus. Why will no one be my friend?","The octopus said gently, Try giving away some of your shiny scales. You will see what happens.","Matthew found Drea. I am sorry I was unkind. Here, please have this scale. He gave her one shimmering scale.","Drea's eyes lit up with joy! Thank you, Matthew! That made Matthew feel warm and wonderful inside.","He gave a scale to every fish who wanted one. With each scale he gave away, he felt happier!","Soon Matthew had only one shiny scale left. But he had something much better: friends everywhere!","Sharing what we have makes us so much happier than keeping everything for ourselves! The end!"],questions:[{q:"Why was Matthew lonely?",opts:["He was ugly","He was proud and would not share or play","He lived far away"],ans:1,emoji:"🐟"},{q:"What did the octopus suggest?",opts:["Swim away","Give away some scales","Find new fish"],ans:1,emoji:"🐙"},{q:"What is the lesson?",opts:["Keep your things safe","Beautiful fish have no friends","Sharing makes us happier!"],ans:2,emoji:"⭐"}]},
{week:3,day:3,title:"Stone Soup",sub:"Everyone Has Something to Give",emoji:"🍲",color:"#FF922B",dark:"#d9480f",moral:"When everyone shares a little, we can make something wonderful together!",paras:["Matthew and Drea arrived in a village feeling very hungry. But everyone said, We have no food to spare!","Matthew had an idea. He placed a big pot of water over a fire and dropped in a smooth stone.","What are you doing? asked a curious villager. Making stone soup! said Matthew. It is delicious, but it needs just a little something more.","I have a carrot I could add, said one villager. Wonderful! In went the carrot.","I have some potatoes, said another. And I have an onion! said a third.","One by one, every villager added something small: beans, herbs, salt, bread.","Drea stirred the pot and the most wonderful smell filled the whole village square!","Soon the pot was full of the most delicious soup anyone had ever tasted!","This is amazing! said the villagers. How did you make soup from a stone?","Matthew smiled. It was not the stone that made the soup. It was all of YOU! Each person shared just a little, and together we made something wonderful.","The villagers looked at each other and smiled. They had plenty all along. They just needed to share!","When everyone gives a little, we can make something wonderful together! The end!"],questions:[{q:"What did Matthew put in the pot first?",opts:["A carrot","A stone","An onion"],ans:1,emoji:"🪨"},{q:"What really made the soup delicious?",opts:["The magic stone","Everyone sharing a little","The water"],ans:1,emoji:"🍲"},{q:"What is the lesson?",opts:["Stones are tasty","Never share food","When everyone shares, we make something wonderful!"],ans:2,emoji:"⭐"}]},
{week:3,day:4,title:"The Brave Little Tailor",sub:"Believe in Yourself",emoji:"🪡",color:"#CC5DE8",dark:"#862e9c",moral:"Believe in yourself! You are braver and cleverer than you think!",paras:["Once upon a time, a little tailor named Matthew swatted seven flies with one blow of his hand!","Seven in one blow! he said proudly. He made a belt that said SEVEN IN ONE BLOW and set off on an adventure.","Along the way he met his friend Drea. Where are you going? she asked.","To see the world! I defeated seven in one blow! Everyone thought he meant seven giants!","The King heard about Matthew. If you are so brave, please help us! A terrible giant is scaring our village!","Matthew was nervous. But Drea whispered, You are clever, Matthew. Use your brain, not your muscles!","They found the giant sleeping under a tree, snoring like thunder. Matthew had an idea.","He filled the giant's hat with water. When the giant put his hat on, SPLASH! Cold water everywhere!","The giant jumped up, confused and dripping. He ran away and never came back!","The whole village cheered! Matthew smiled at Drea. I did not need to be big or strong. I just needed to be clever!","You believed in yourself, said Drea. And that made all the difference.","Believe in yourself! You are braver and cleverer than you think! The end!"],questions:[{q:"What did Matthew really defeat?",opts:["Seven giants","Seven flies","Seven dragons"],ans:1,emoji:"🪰"},{q:"How did Matthew scare the giant?",opts:["He fought him","He used a clever water trick","He called for help"],ans:1,emoji:"💧"},{q:"What is the lesson?",opts:["Be very strong","Believe in yourself, you are cleverer than you think!","Giants are silly"],ans:1,emoji:"⭐"}]},
{week:3,day:5,title:"The Elves and the Shoemaker",sub:"Kindness Comes Back to You",emoji:"👞",color:"#FF79C6",dark:"#c2255c",moral:"When we are kind to others, kindness always finds its way back to us!",paras:["Once upon a time, a poor shoemaker named Matthew had only enough leather to make one last pair of shoes.","He cut the leather carefully and left it on his workbench. In the morning, he found the most beautiful shoes already made!","A customer bought them for a wonderful price! Matthew bought more leather and left it out again.","Every morning, beautiful new shoes appeared! Matthew and Drea were so curious. Who is helping us?","One night they hid and watched. Two tiny elves appeared and sewed the most perfect shoes with tiny, nimble fingers!","The elves have no warm clothes! whispered Drea. They must be so cold!","Matthew and Drea spent all night making tiny coats, trousers, and shoes for the elves.","They left the tiny clothes on the workbench. That night, the elves found them and danced with joy!","The elves never came back to make shoes. But Matthew's shop was now famous for beautiful work!","The elves helped us when we needed it most, said Matthew. And we helped them when they needed it.","That is how kindness works, smiled Drea. It always comes back around.","When we are kind to others, kindness always finds its way back! The end!"],questions:[{q:"Who made the shoes at night?",opts:["Matthew","Two tiny elves","Drea"],ans:1,emoji:"🧝"},{q:"What did Matthew and Drea make for the elves?",opts:["More shoes to sell","Tiny warm clothes","A little house"],ans:1,emoji:"🧥"},{q:"What is the lesson?",opts:["Elves are good at sewing","Kindness always comes back to us!","Shoes are expensive"],ans:1,emoji:"⭐"}]},
{week:3,day:6,title:"The North Star",sub:"Finding Your Way",emoji:"⭐",color:"#845EF7",dark:"#5f3dc4",moral:"Even when things feel dark and scary, there is always a light to guide you home!",paras:["One evening, Matthew and Drea were playing in the forest when they suddenly realized it was getting very dark!","Oh no! said Drea. Which way is home? All the trees look the same in the dark!","Matthew felt scared. But then he remembered something Grandpa had taught him.","Look up, Drea! See that bright star? That is the North Star. It always points the way home!","Drea looked up through the branches. There it was, shining steady and bright while all the other stars twinkled.","If we keep walking toward the North Star, we will find our way, said Matthew.","They held hands and walked together. The forest was dark, but the star was always there, guiding them.","Sometimes clouds covered it. They waited patiently until it appeared again.","After a while, they saw the warm golden light of their cottage windows!","We made it! cried Drea, hugging Matthew tight. We found our way home!","Even when things felt dark and scary, we had a light to guide us, said Matthew.","And we had each other, said Drea. Even in the darkest times, there is always a light to guide you home! The end!"],questions:[{q:"Why were Matthew and Drea scared?",opts:["A wolf was chasing them","They were lost in the dark forest","It was raining"],ans:1,emoji:"🌲"},{q:"What guided them home?",opts:["A map","The North Star","A flashlight"],ans:1,emoji:"⭐"},{q:"What is the lesson?",opts:["Never go outside","There is always a light to guide you, even in dark times!","Stars are very far away"],ans:1,emoji:"⭐"}]}
);
</script>
<script>
// WEEK 4
STORIES.push(
{week:4,day:0,title:"The Magic Porridge Pot",sub:"Knowing When Enough is Enough",emoji:"🍯",color:"#FF5757",dark:"#c92a2a",moral:"Always know when enough is enough. Too much of anything can cause trouble!",paras:["A kind girl named Drea lived with her mama in a tiny cottage. They were very poor and often hungry.","One day in the forest, Drea met a wise old woman who gave her a magic pot. Say Cook, little pot! and it makes porridge. Say Stop, little pot! and it stops.","Drea ran home. Cook, little pot! Warm, delicious porridge filled the pot! They ate until they were full and happy.","Every day, the magic pot fed them perfectly. Drea always remembered to say Stop, little pot!","One day, Drea went to visit her friend Matthew. While she was gone, Mama got hungry.","Cook, little pot! said Mama. The pot began to cook. But Mama had forgotten the words to make it stop!","The porridge kept coming! It filled the pot, then the table, then the floor! It flowed out the door and down the street!","Matthew saw the river of porridge flowing through the village. Oh no! Where is Drea?","They ran back together. Drea burst through the door. Stop, little pot! The pot stopped instantly.","The whole village was covered in porridge! Everyone laughed and helped clean up.","I should have taught Mama the stop words too, said Drea. And Mama, always know when enough is enough!","Too much of anything, even something good, can cause trouble! The end!"],questions:[{q:"What did the magic pot make?",opts:["Soup","Porridge","Cake"],ans:1,emoji:"🍯"},{q:"Why did the porridge overflow?",opts:["The pot was broken","Mama forgot the stop words","Drea told it to keep going"],ans:1,emoji:"😱"},{q:"What is the lesson?",opts:["Magic pots are dangerous","Know when enough is enough!","Never leave home"],ans:1,emoji:"⭐"}]},
{week:4,day:1,title:"The Bundle of Sticks",sub:"Together We Are Strong",emoji:"🪵",color:"#FF922B",dark:"#d9480f",moral:"Alone we can be broken, but together we are unbreakable!",paras:["Once there were three friends who argued all the time: Matthew, Drea, and their friend Pip.","I can do everything by myself! said Matthew. I do not need anyone's help! said Drea. Me neither! said Pip.","Their wise grandmother watched them sadly. She called them over. I have something to show you.","She handed Matthew a single thin stick. Break it, she said. SNAP! Matthew broke it easily.","She handed Drea a single stick. SNAP! Easy. Pip too. SNAP!","Now, said Grandmother, she tied three sticks together in a bundle. Try to break this.","Matthew tried with all his might. He could not break it! Drea tried. Pip tried. Nobody could!","Do you see? said Grandmother gently. One stick alone is easy to break. But together, they are unbreakable.","The three friends looked at each other. When we argue and go alone, we are weak like single sticks.","But when we stick together and help each other, nothing can break us! said Matthew.","From that day on, they stopped arguing and worked as a team. And together, they were unstoppable!","Alone we can be broken. Together we are unbreakable! The end!"],questions:[{q:"What could Matthew break easily?",opts:["A rock","A single stick","The bundle"],ans:1,emoji:"🪵"},{q:"Why could nobody break the bundle?",opts:["It was magic","The sticks together were too strong","They were not trying hard enough"],ans:1,emoji:"💪"},{q:"What is the lesson?",opts:["Sticks are useful","Together we are unbreakable!","Never argue"],ans:1,emoji:"⭐"}]},
{week:4,day:2,title:"The Tortoise and the Eagle",sub:"Be Happy With Who You Are",emoji:"🦅",color:"#4DABF7",dark:"#1971c2",moral:"We are all special in our own way. Wishing to be someone else means missing what makes us wonderful!",paras:["Drea was a little tortoise who watched the birds fly high above her every day.","Oh, how I wish I could fly! she sighed. If only I had wings instead of this heavy shell!","Her friend Matthew the eagle landed beside her. Why do you look so sad, Drea?","I wish I could fly like you, Matthew. You are so free and fast up in the sky!","Matthew thought carefully. But Drea, you have something I do not. Your shell keeps you safe and warm. You can swim in the pond. You live for a very, very long time!","I never thought of that, said Drea slowly.","And I cannot carry my home with me wherever I go, said Matthew. When it rains, I get soaking wet! You just tuck inside your shell!","Drea laughed. That is true! My shell IS pretty wonderful.","We are all special in different ways, said Matthew. If everyone was the same, the world would be very boring!","Drea smiled. You are right. I love being a tortoise. I can do things no one else can!","And I love being your friend, said Matthew. Just the way you are.","We are all special in our own way. What makes us different is what makes us wonderful! The end!"],questions:[{q:"What did Drea wish she could do?",opts:["Swim faster","Fly like an eagle","Run like a cheetah"],ans:1,emoji:"🦅"},{q:"What special thing did Drea have?",opts:["Wings","A safe shell she carries everywhere","Very long legs"],ans:1,emoji:"🐢"},{q:"What is the lesson?",opts:["Flying is the best","We are all special in our own way!","Tortoises are slow"],ans:1,emoji:"⭐"}]},

<script>
// ════════════════════════════════════════════════════════════════
// APP STATE & UTILITIES
// ════════════════════════════════════════════════════════════════
const getDayIdx=()=>{const d=new Date().getDay();return d===0?6:d-1;};
const getWeek=()=>{const n=new Date(),s=new Date(2026,0,1),diff=Math.floor((n-s)/86400000),w=Math.floor(diff/7)%5;return w+1;};

let S={week:getWeek(),dayIdx:getDayIdx(),phase:'cover',speaking:false,curPara:0,fromPara:0,storyDone:false,quizIdx:0,chosen:null,score:0,curEmo:{icon:'📖',label:'Story Time'}};
// If no story for current week+day, default to week 1
if(!STORIES.find(s=>s.week===S.week&&s.day===S.dayIdx)){S.week=1;}
let shouldStop=false;
const synth=window.speechSynthesis;

// ── Name customization ──
let NAME1=localStorage.getItem('st_name1')||'Matthew';
let NAME2=localStorage.getItem('st_name2')||'Drea';
function sub(text){return text.replace(/\bMatthew\b/g,NAME1).replace(/\bDrea\b/g,NAME2);}
function saveNames(){localStorage.setItem('st_name1',NAME1);localStorage.setItem('st_name2',NAME2);}
function openNames(){document.getElementById('name-modal').style.display='flex';document.getElementById('inp-name1').value=NAME1;document.getElementById('inp-name2').value=NAME2;document.getElementById('inp-elkey').value=EL_KEY;}
function closeNames(){document.getElementById('name-modal').style.display='none';}
function applyNames(){
  const n1=document.getElementById('inp-name1').value.trim();
  const n2=document.getElementById('inp-name2').value.trim();
  const key=document.getElementById('inp-elkey').value.trim();
  if(n1)NAME1=n1;if(n2)NAME2=n2;
  saveNames();
  if(!key){EL_KEY='';localStorage.setItem('st_el_key','');closeNames();render();return;}
  // Validate key with a tiny test request
  fetch('https://api.elevenlabs.io/v1/user',{headers:{'xi-api-key':key}})
    .then(r=>{if(!r.ok)throw new Error();return r.json();})
    .then(()=>{EL_KEY=key;localStorage.setItem('st_el_key',EL_KEY);closeNames();render();})
    .catch(()=>{document.getElementById('inp-elkey').value='';document.getElementById('inp-elkey').style.borderColor='#FF5757';alert('Invalid API key. Leave blank to use device voice.');});
}

const story=()=>STORIES.find(s=>s.week===S.week&&s.day===S.dayIdx);

const analyzeEmotion=(text)=>{
  const t=text.toLowerCase();
  if(/\b(roar|roared|growl|fee fi fo|stomp|boom|crash|snap|woof|thunder|bellowed)\b/.test(t))return{icon:'😱',label:'Dramatic!'};
  if(/\b(wolf|danger|trap|hunter|frightened|terrified|crept|hiding|trembl)\b/.test(t))return{icon:'😰',label:'Suspense...'};
  if(text.includes('!')&&/\b(ran|run|zoom|dash|jump|hurry|quick|fast|chased|scrambl)\b/.test(t))return{icon:'⚡',label:'Action!'};
  if(/\b(hooray|hurrah|wonderful|magnificent|delicious|amazing|brilliant|yay|cheered)\b/.test(t)&&text.includes('!'))return{icon:'🎉',label:'Hooray!'};
  if(text.trim().endsWith('!'))return{icon:'😄',label:'Excited!'};
  if(/\b(whisper|whispered|gently|quietly|softly|alone|sadly|sorry|tears|cry|cried|poor)\b/.test(t))return{icon:'💙',label:'Gently...'};
  if(text.trim().endsWith('?'))return{icon:'🤔',label:'Curious?'};
  return{icon:'📖',label:'Story Time'};
};

// ── ElevenLabs TTS with IndexedDB cache ──
const EL_VOICE='21m00Tcm4TlvDq8ikWAM'; // "Rachel" - warm, expressive storytelling voice
let EL_KEY=localStorage.getItem('st_el_key')||'';

// IndexedDB for audio cache
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open('storytime-audio',1);r.onupgradeneeded=e=>{e.target.result.createObjectStore('clips');};r.onsuccess=e=>res(e.target.result);r.onerror=e=>rej(e);});}
function dbGet(key){return openDB().then(db=>new Promise((res,rej)=>{const tx=db.transaction('clips','readonly');const r=tx.objectStore('clips').get(key);r.onsuccess=()=>res(r.result);r.onerror=rej;}));}
function dbPut(key,val){return openDB().then(db=>new Promise((res,rej)=>{const tx=db.transaction('clips','readwrite');tx.objectStore('clips').put(val,key);tx.oncomplete=()=>res();tx.onerror=rej;}));}

function elevenLabsTTS(text){
  const cacheKey=EL_VOICE+'_'+text.substring(0,100);
  return dbGet(cacheKey).then(cached=>{
    if(cached)return cached;
    return fetch('https://api.elevenlabs.io/v1/text-to-speech/'+EL_VOICE+'/stream',{
      method:'POST',
      headers:{'Content-Type':'application/json','xi-api-key':EL_KEY},
      body:JSON.stringify({text:text,model_id:'eleven_monolingual_v1',voice_settings:{stability:0.4,similarity_boost:0.8,style:0.7,use_speaker_boost:true}})
    }).then(r=>{if(!r.ok)throw new Error(r.status);return r.blob();})
    .then(blob=>{dbPut(cacheKey,blob);return blob;});
  });
}

let currentAudio=null;

function speakFrom(startIdx){
  const st=story();if(!st)return;stopSpeaking();shouldStop=false;
  const paras=st.paras.slice(startIdx).map((p,i)=>({text:sub(p),paraIdx:startIdx+i,emo:analyzeEmotion(p)}));
  if(!paras.length)return;S.speaking=true;updatePlayBtn();
  let idx=0;

  const playNext=()=>{
    if(shouldStop||idx>=paras.length){if(!shouldStop){S.speaking=false;S.storyDone=true;updatePlayBtn();showQuizTrigger();}updateEmojiBadge(null);return;}
    const item=paras[idx];
    S.curPara=item.paraIdx;S.fromPara=item.paraIdx;S.curEmo=item.emo;
    updateParaHighlight(item.paraIdx);updateEmojiBadge(item.emo);

    if(EL_KEY){
      elevenLabsTTS(item.text).then(blob=>{
        if(shouldStop)return;
        const url=URL.createObjectURL(blob);
        currentAudio=new Audio(url);
        currentAudio.playbackRate=0.9;
        currentAudio.onended=()=>{URL.revokeObjectURL(url);idx++;setTimeout(playNext,200);};
        currentAudio.onerror=()=>{idx++;setTimeout(playNext,100);};
        currentAudio.play();
      }).catch(()=>{fallbackSpeak(item,()=>{idx++;setTimeout(playNext,150);});});
    } else {
      fallbackSpeak(item,()=>{idx++;setTimeout(playNext,150);});
    }
  };
  playNext();
}

function fallbackSpeak(item,onDone){
  const u=new SpeechSynthesisUtterance(item.text);
  u.rate=0.75;u.pitch=1.0;u.volume=1.0;
  const vv=synth.getVoices();
  const v=vv.find(v=>v.name==='Google UK English Male')||vv.find(v=>v.name.includes('Daniel')&&v.lang.startsWith('en'))||vv.find(v=>v.lang==='en-GB')||vv.find(v=>v.lang.startsWith('en'));
  if(v)u.voice=v;
  u.onend=onDone;u.onerror=()=>onDone();
  synth.speak(u);
}

function stopSpeaking(){
  shouldStop=true;
  if(currentAudio){currentAudio.pause();currentAudio=null;}
  synth.cancel();S.speaking=false;updatePlayBtn();updateEmojiBadge(null);
}

function updateParaHighlight(idx){
  document.querySelectorAll('.para').forEach((el,i)=>el.classList.toggle('hi',i===idx));
  document.querySelectorAll('.dot').forEach((el,i)=>{el.classList.toggle('done',i<idx);el.classList.toggle('cur',i===idx);});
  const el=document.querySelectorAll('.para')[idx];if(el)el.scrollIntoView({behavior:'smooth',block:'center'});
}
function updateEmojiBadge(emo){
  const b=document.getElementById('emo-badge');if(!b)return;
  if(!emo){b.classList.remove('on');return;}b.classList.add('on');
  b.innerHTML=`<span style="animation:wobble 1s infinite;display:inline-block">${emo.icon}</span><span style="font-family:'Bubblegum Sans',cursive;font-size:13px;color:var(--sdc)">🎙️ ${emo.label}</span><span>${[0,1,2].map(i=>`<span class="eq-bar" style="height:${8+i*5}px;animation:eq ${.4+i*.15}s ${i*.1}s infinite"></span>`).join('')}</span>`;
}
function updatePlayBtn(){const b=document.getElementById('play-btn');if(!b)return;b.textContent=S.speaking?'⏸️ Pause':S.storyDone?'🔄 Again!':(S.fromPara>0?'▶️ Continue':'▶️ Play Story');}
function showQuizTrigger(){const q=document.getElementById('quiz-trigger');if(q)q.style.display='block';}

// Stars
(function(){const sb=document.getElementById('stars-bg');for(let i=0;i<55;i++){const s=document.createElement('div');s.className='star';const sz=(i%3)+1.5;s.style.cssText=`left:${(i*37+7)%100}%;top:${(i*53+11)%100}%;width:${sz}px;height:${sz}px;animation:twinkle ${2+(i%3)}s ${(i*.17)%3}s infinite alternate ease-in-out`;sb.appendChild(s);}})();

// Confetti
function showConfetti(){const cl=document.getElementById('confetti-layer');cl.style.display='block';cl.innerHTML='';const colors=['#FFD43B','#FF5757','#51CF66','#4DABF7','#CC5DE8','#FF79C6'];for(let i=0;i<20;i++){const c=document.createElement('div');c.className='cp';const sz=(i%3)+10;c.style.cssText=`left:${(i*13+5)%90+5}%;top:10%;width:${sz}px;height:${sz}px;background:${colors[i%6]};animation:cfall ${1.2+(i%4)*.3}s ${(i*.15)%1.5}s ease-in forwards`;cl.appendChild(c);}setTimeout(()=>{cl.style.display='none';},3000);}

// ════════════════════════════════════════════════════════════════
// RENDER
// ════════════════════════════════════════════════════════════════
function setColors(st){const r=document.documentElement;r.style.setProperty('--sc',st.color);r.style.setProperty('--sdc',st.dark);r.style.setProperty('--sg',`linear-gradient(135deg,${st.color},${st.dark})`);r.style.setProperty('--sc-bg',st.color+'20');r.style.setProperty('--sc-light',st.color+'44');r.style.setProperty('--glow',st.color+'66');document.getElementById('hdr').style.background=`linear-gradient(135deg,${st.color},${st.dark})`;}

function renderWeekBtns(){
  const wr=document.getElementById('week-row');
  const currW=getWeek();const st=story();
  wr.innerHTML=[1,2,3,4,5].map(w=>{
    const active=S.week===w;const label=w===5?'Bonus':`Wk ${w}`;
    const days=DAYS_PER_WEEK[w-1];
    return`<button class="wbtn" onclick="setWeek(${w})" style="background:${active?'white':'rgba(255,255,255,.25)'};color:${active?(st?st.dark:'#333'):'white'}">${label}${w===currW?' ✦':''}</button>`;
  }).join('');
}

function renderDayRow(){
  const st=story();const todayDay=getDayIdx(),todayWeek=getWeek();
  const numDays=DAYS_PER_WEEK[S.week-1];
  document.getElementById('day-row').innerHTML=Array.from({length:numDays},(_, i)=>`
    <button class="dbtn ${S.dayIdx===i?'active':''}" onclick="selectDay(${i})"
      style="${S.dayIdx===i?`background:${DAY_COLORS[i%7]};border-color:${DAY_COLORS[i%7]};box-shadow:0 4px 14px ${DAY_COLORS[i%7]}66`:''}">
      <span style="font-size:14px">${DAY_NAMES[i%7][0]}</span>
      <span style="font-size:8px;font-weight:800">${DAY_SHORT[i%7]}</span>
      ${i===todayDay&&S.week===todayWeek?'<span style="font-size:6px">●</span>':''}
    </button>`).join('');
}

function renderCover(){
  const st=story();if(!st){
    const allStories=STORIES.filter(s=>s.week===S.week);
    const picks=allStories.length?allStories:STORIES.slice(0,3);
    return`<div class="cover"><div class="c-emoji" style="font-size:60px">🌙</div><div class="c-title" style="color:#845EF7">Good ${new Date().getHours()<12?'Morning':'Evening'}, Storyteller!</div><div class="c-sub">Pick a day above to start your adventure</div><div style="margin-top:14px;display:flex;flex-direction:column;gap:8px">${picks.map(p=>`<button onclick="S.week=${p.week};S.dayIdx=${p.day};S.phase='cover';render()" style="padding:10px 14px;border-radius:14px;border:2px solid ${p.color}44;background:${p.color}10;cursor:pointer;text-align:left;display:flex;align-items:center;gap:10px"><span style="font-size:24px">${p.emoji}</span><span style="font-family:'Bubblegum Sans',cursive;font-size:14px;color:${p.dark}">${p.title}</span></button>`).join('')}</div></div>`;
  }
  const todayDay=getDayIdx(),todayWeek=getWeek();const isToday=S.dayIdx===todayDay&&S.week===todayWeek;
  const tip=!localStorage.getItem('st_tip_dismissed')?`<div style="margin-top:14px;padding:10px 14px;border-radius:14px;background:rgba(0,0,0,.04);border:1.5px solid rgba(0,0,0,.08);text-align:left;position:relative"><button onclick="localStorage.setItem('st_tip_dismissed','1');render()" style="position:absolute;top:6px;right:10px;background:none;border:none;font-size:14px;cursor:pointer;color:#aaa">✕</button><p style="font-size:11px;color:#888;line-height:1.5;margin:0"><b>📱 iPhone Tip:</b> Tap <b>Share</b> (□↑) → <b>Add to Home Screen</b> to install as an app. Works offline!</p></div>`:'';
  return`<div class="cover"><div class="c-emoji">${st.emoji}</div><div class="c-title" style="color:${st.dark}">${sub(st.title)}</div><div class="c-sub">${sub(st.sub)}</div><div class="moral-box" style="background:${st.color}15;border-color:${st.color}88"><span>💡</span><p style="color:${st.dark}">${sub(st.moral)}</p></div><div class="day-badge" style="background:${DAY_COLORS[S.dayIdx%7]}22;border-color:${DAY_COLORS[S.dayIdx%7]}55;color:${DAY_COLORS[S.dayIdx%7]}">📅 ${DAY_NAMES[S.dayIdx%7]} · Week ${S.week}${isToday?' · Today! 🌟':''}</div><button class="read-btn" style="background:${st.color};box-shadow:0 6px 24px ${st.color}66" onclick="gotoStory()">🎙️ Read to Me!</button>${tip}</div>`;
}

function renderStory(){
  const st=story();if(!st)return'';
  return`<div class="story-view"><div class="s-hdr" style="background:${st.color}15;border-color:${st.color}"><span style="font-size:28px">${st.emoji}</span><div class="s-hdr-text"><div class="s-hdr-title" style="color:${st.dark}">${sub(st.title)}</div><div class="s-hdr-sub">${sub(st.sub)}</div></div></div><div id="paras">${st.paras.map((p,i)=>`<div class="para ${i===S.curPara&&S.speaking?'hi':''}"><p>${sub(p)}</p></div>`).join('')}</div><div id="dots">${st.paras.map((_,i)=>`<div class="dot ${i<S.curPara?'done':''} ${i===S.curPara?'cur':''}"></div>`).join('')}</div><div id="emo-badge" ${S.speaking?'class="on"':''}></div><div class="tts-row"><button id="play-btn" onclick="handlePlay()" style="background:linear-gradient(135deg,${st.color},${st.dark})">${S.speaking?'⏸️ Pause':S.storyDone?'🔄 Again!':(S.fromPara>0?'▶️ Continue':'▶️ Play Story')}</button><button id="restart-btn" onclick="handleRestart()">🔁</button></div><div class="hint">🎙️ Slow, clear voice with emotion • 🐢 Kid-friendly pace</div><button id="quiz-trigger" onclick="gotoQuiz()" style="display:${S.storyDone||S.curPara>=st.paras.length-3?'block':'none'}">🌟 Quiz Time!</button><button id="back-btn" onclick="gotoCover()">← Back</button></div>`;
}

function renderQuiz(){
  const st=story();if(!st)return'';const q=st.questions[S.quizIdx];const letters=['A','B','C'];const pct=((S.quizIdx)/3)*100;
  return`<div class="quiz-view"><div class="qz-hdr"><h2 style="color:${st.dark}">🧠 Quiz Time!</h2><p>Question ${S.quizIdx+1} of 3</p><div id="qz-prog"><div id="qz-bar" style="width:${pct}%;background:linear-gradient(90deg,${st.color},${st.dark})"></div></div></div><div class="q-box" style="background:${st.color}18;border-color:${st.color}44"><div class="q-emoji">${q.emoji}</div><div class="q-text">${sub(q.q)}</div></div><div id="opts">${q.opts.map((opt,i)=>{let cls='opt',lbg=`${st.color}22`,lclr=st.dark;if(S.chosen!==null){if(i===q.ans){cls='opt correct';lbg='#51CF66';lclr='#fff';}else if(i===S.chosen){cls='opt wrong';lbg='#FF5757';lclr='#fff';}}return`<button class="${cls}" onclick="handleAnswer(${i})" ${S.chosen!==null?'disabled':''}><span class="opt-letter" style="background:${lbg};color:${lclr}">${S.chosen!==null?(i===q.ans?'✓':i===S.chosen?'✗':letters[i]):letters[i]}</span>${sub(opt)}</button>`;}).join('')}</div><div id="feedback" style="${S.chosen!==null?`display:block;background:${S.chosen===q.ans?'#d3f9d8':'#fff3bf'}`:'display:none'}">${S.chosen!==null?(S.chosen===q.ans?'🌟 Great job!':'💛 Good try!'):''}  </div></div>`;
}

function renderComplete(){
  const st=story();if(!st)return'';
  const trophy=S.score===3?'🏆':S.score===2?'🌟':'⭐';const title=S.score===3?'Perfect Score!':S.score===2?'Amazing!':'Great effort!';
  return`<div class="done-view"><div class="trophy">${trophy}</div><div class="done-title" style="color:${st.dark}">${title}</div><div class="done-msg">You got ${S.score} out of 3!</div><div class="star-row">${[0,1,2].map(i=>`<span class="sa ${i<S.score?'':'off'}" style="animation:${i<S.score?`popIn ${.3+i*.15}s ease`:'none'}">⭐</span>`).join('')}</div><div class="moral-card" style="background:${st.color}18"><div class="moral-card-lbl">💡 Today's Lesson:</div><div class="moral-card-txt" style="color:${st.dark}">"${sub(st.moral)}"</div></div><button id="again-btn" style="background:linear-gradient(135deg,${st.color},${st.dark})" onclick="gotoCover()">📚 Read Again or Pick Another Day!</button></div>`;
}

// ════════════════════════════════════════════════════════════════
// ACTIONS
// ════════════════════════════════════════════════════════════════
function render(){const st=story();if(st)setColors(st);renderDayRow();renderWeekBtns();document.getElementById('hdr-title').innerHTML=`✨ Story Time with ${NAME1} &amp; ${NAME2} ✨<button onclick="openNames()" style="background:none;border:none;color:#fff;font-size:16px;cursor:pointer;margin-left:6px;vertical-align:middle;opacity:.8">⚙️</button>`;let html='';if(S.phase==='cover')html=renderCover();else if(S.phase==='story')html=renderStory();else if(S.phase==='quiz')html=renderQuiz();else if(S.phase==='complete')html=renderComplete();document.getElementById('content').innerHTML=html;}
function resetForNewStory(){stopSpeaking();S.phase='cover';S.curPara=0;S.fromPara=0;S.storyDone=false;S.quizIdx=0;S.chosen=null;S.score=0;S.curEmo={icon:'📖',label:'Story Time'};}
function setWeek(w){S.week=w;S.dayIdx=0;resetForNewStory();render();}
function selectDay(i){S.dayIdx=i;resetForNewStory();render();}
function gotoCover(){stopSpeaking();S.phase='cover';render();}
function gotoStory(){S.phase='story';render();}
function gotoQuiz(){stopSpeaking();S.phase='quiz';S.quizIdx=0;S.chosen=null;S.score=0;render();}
function handlePlay(){if(S.speaking){stopSpeaking();}else{if(S.storyDone){S.storyDone=false;S.curPara=0;S.fromPara=0;}speakFrom(S.fromPara);}}
function handleRestart(){stopSpeaking();S.curPara=0;S.fromPara=0;S.storyDone=false;setTimeout(()=>speakFrom(0),120);}
function handleAnswer(optIdx){if(S.chosen!==null)return;const st=story();S.chosen=optIdx;if(optIdx===st.questions[S.quizIdx].ans)S.score++;render();setTimeout(()=>{if(S.quizIdx<2){S.quizIdx++;S.chosen=null;render();}else{showConfetti();S.phase='complete';render();}},1600);}
if(synth.onvoiceschanged!==undefined){synth.onvoiceschanged=()=>{};}

// ── iOS: Keep audio alive when screen is off / Bluetooth switches ──
let audioCtx=null;
function ensureAudioCtx(){
  if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended')audioCtx.resume();
  // Silent oscillator keeps audio session active
  if(!audioCtx._osc){const osc=audioCtx.createOscillator();const gain=audioCtx.createGain();gain.gain.value=0.001;osc.connect(gain);gain.connect(audioCtx.destination);osc.start();audioCtx._osc=true;}
}
document.addEventListener('click',ensureAudioCtx,{once:true});
document.addEventListener('touchstart',ensureAudioCtx,{once:true});

// Auto-resume when Bluetooth connects/disconnects (audio route change)
setInterval(()=>{if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();},1000);
// Resume audio if it was interrupted (e.g. Bluetooth switch)
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden){
    if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();
    if(currentAudio&&currentAudio.paused&&S.speaking)currentAudio.play();
  }
});

render();
</script>
</body>
